name: Treadmill support
description: Trot can't find or read your treadmill.
labels: ["treadmill-support"]
body:
  - type: markdown
    attributes:
      value: |
        Only LifeSpan is tested on real hardware here — everything else is
        generic FTMS, inferred from the Bluetooth spec. A good report is the one
        thing nobody else can provide, so thank you.

        Closed ecosystems (**iFit**/NordicTrack/ProForm, **Peloton**, **Echelon**)
        don't broadcast their data at all, so no third-party tool can read them.
        If yours is one of those, sadly there's nothing to add.
  - type: input
    id: model
    attributes:
      label: Make and model
      placeholder: e.g. Horizon 7.0 AT
    validations:
      required: true
  - type: textarea
    id: scan
    attributes:
      label: Output of `trot scan --all`
      description: Run it with the treadmill powered on and nearby.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: ftms
    attributes:
      label: Does the console advertise FTMS?
      description: Look for an "FTMS" setting, or a "broadcast to Zwift / Kinomap" mode.
      options:
        - "Yes — it has an FTMS or Zwift/Kinomap mode"
        - "No"
        - "Don't know"
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: What happens when you try?
      description: Does it pair and report nothing, connect then drop, or never appear at all?
    validations:
      required: true

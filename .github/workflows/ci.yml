# Everything that runs on a push or pull request.
#
# The quality gate itself lives in test.yml so that release.yml can reuse the
# exact same definition (see dist's `plan-jobs`) — a release is therefore gated
# on the same checks a PR is.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; the coverage job needs to push its badge JSON to the
# `badges` branch and asks for write itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # fmt + clippy + tests on Linux, macOS and Windows.
  test:
    uses: ./.github/workflows/test.yml

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to update the badges branch
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install Linux Bluetooth build deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Measure coverage
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          cargo llvm-cov report --html --output-dir coverage-html

      # Put the per-file table straight in the run summary so coverage is
      # readable in the Actions UI without downloading anything.
      - name: Publish the summary
        if: always()
        run: |
          # tee so the table is readable both in the run summary and in the
          # plain job log (the summary isn't reachable from the CLI/API).
          cargo llvm-cov report --summary-only | tee /tmp/cov.txt
          {
            echo "## Coverage"
            echo
            echo '```'
            cat /tmp/cov.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: |
            lcov.info
            coverage-html
          retention-days: 30

      # Publish the number as a shields.io endpoint so the README badge is real
      # rather than a hand-updated guess. The JSON lives on an orphan `badges`
      # branch: shields reads it over raw.githubusercontent, and main never sees
      # a bot commit. No third-party coverage service, no token beyond the one
      # Actions already has.
      - name: Publish the coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pct=$(cargo llvm-cov report --json --summary-only \
                | python3 -c "import json,sys; print(round(json.load(sys.stdin)['data'][0]['totals']['lines']['percent'],1))")
          # green >=80, yellow >=60, orange >=40, else red
          colour=$(python3 -c "p=$pct; print('brightgreen' if p>=80 else 'yellow' if p>=60 else 'orange' if p>=40 else 'red')")
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$pct" "$colour" > /tmp/coverage.json
          echo "coverage: $pct% ($colour)"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin badges --depth=1 2>/dev/null && git checkout badges \
            || git checkout --orphan badges && git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 ! -name . ! -name .git ! -name coverage.json -exec rm -rf {} + 2>/dev/null || true
          cp /tmp/coverage.json coverage.json
          git add coverage.json
          # Only commit when the number actually moved.
          git diff --cached --quiet || git commit -m "coverage: $pct%"
          git push origin badges

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-audit
      - name: Check dependencies for advisories
        run: cargo audit --deny warnings

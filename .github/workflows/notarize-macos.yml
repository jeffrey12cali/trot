# Notarize the macOS binaries after a release is published.
#
# WHY THIS EXISTS: dist signs the macOS binaries (macos-sign = true) but it does
# NOT notarize — there is no notarytool anywhere in dist 0.32.0. Since macOS
# 10.15, a *signed but un-notarized* download is still blocked by Gatekeeper; the
# dialog just changes wording. Notarization is the part that actually removes the
# warning, so it happens here.
#
# HOW IT WORKS: notarization binds a ticket to the binary's code hash, published
# by Apple and checked online at first launch. A bare CLI binary cannot be
# "stapled" (stapling only works on .app/.dmg/.pkg), so we do NOT need to modify
# or re-upload the release archives — we notarize the exact bytes that already
# shipped, and Gatekeeper resolves the ticket on the user's machine.
#
# REQUIREMENTS: the binaries must already be signed with a Developer ID *and* the
# hardened runtime (CODESIGN_OPTIONS=runtime), or Apple rejects the submission.
name: Notarize macOS

# Runs as the last stage of the release pipeline (dist's `post-announce-jobs`),
# NOT on `release: published`. GitHub deliberately does not trigger workflows
# from events raised with GITHUB_TOKEN — and dist publishes the release as
# github-actions[bot] — so a release trigger silently never fires. Learned the
# hard way on v0.3.0.
on:
  workflow_call:
  # Re-run by hand against an existing tag if a submission needs a retry.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to notarize (e.g. v0.3.0)"
        required: false
      submission_id:
        description: "Existing submission UUID to query instead of submitting again"
        required: false

permissions:
  contents: read

jobs:
  notarize:
    # notarytool ships with Xcode, so this must run on macOS.
    runs-on: macos-14
    steps:
      - name: Resolve the tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Check that the notarization secrets are present
        id: guard
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [ -z "$KEY_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Notarization secrets are not configured; skipping (this is expected on forks)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the macOS archives from the release
        if: steps.guard.outputs.ready == 'true' && !inputs.submission_id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ steps.tag.outputs.tag }}" \
            -R "${{ github.repository }}" \
            -p 'trot-*-apple-darwin.tar.xz' -D archives
          ls -la archives

      # Notarization failures are opaque: the submit call only says "Invalid".
      # `notarytool log` is the only thing that says WHY, so it gets its own
      # entry point — a submission UUID can be inspected without resubmitting.
      - name: Inspect an existing submission
        if: steps.guard.outputs.ready == 'true' && inputs.submission_id
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$API_KEY_P8" | base64 --decode > /tmp/AuthKey.p8
          AUTH=(--key /tmp/AuthKey.p8 --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID")
          # History first: it shows every recent submission and its status in one
          # view, which is what you actually want when submissions are stalling.
          echo "::group::history (all recent submissions for this team)"
          xcrun notarytool history "${AUTH[@]}" || echo "(history unavailable)"
          echo "::endgroup::"
          echo "::group::info"
          xcrun notarytool info "${{ inputs.submission_id }}" "${AUTH[@]}"
          echo "::endgroup::"
          echo "::group::log"
          xcrun notarytool log "${{ inputs.submission_id }}" "${AUTH[@]}" || \
            echo "(no log yet — Apple only publishes one once processing finishes)"
          echo "::endgroup::"

      - name: Notarize each macOS binary
        if: steps.guard.outputs.ready == 'true' && !inputs.submission_id
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          # The .p8 is stored base64-encoded so the private key survives being a
          # single-line GitHub secret.
          umask 077
          printf '%s' "$API_KEY_P8" | base64 --decode > /tmp/AuthKey.p8

          stalled=0
          for archive in archives/*.tar.xz; do
            name="$(basename "$archive" .tar.xz)"
            echo "::group::$name"
            rm -rf work && mkdir work
            tar xf "$archive" -C work

            bin="$(find work -type f -name trot -perm +111 | head -1)"
            if [ -z "$bin" ]; then echo "no trot binary in $archive"; exit 1; fi

            # Fail loudly if dist did not actually sign this build — notarization
            # of an unsigned binary is rejected, and silently "succeeding" here
            # would be worse than stopping.
            codesign --verify --strict --verbose=2 "$bin"
            codesign -d --verbose=2 "$bin" 2>&1 | grep -q 'flags=.*runtime' \
              || { echo "binary is not hardened-runtime signed; set CODESIGN_OPTIONS=runtime"; exit 1; }

            # notarytool takes an archive, not a bare executable.
            ditto -c -k --keepParent "$bin" "/tmp/$name.zip"
            # Submit WITHOUT --wait and poll ourselves. `--wait` mixes progress
            # text into stdout and, on timeout, exits non-zero having printed
            # only a message — so the submission id is lost exactly when it is
            # most needed. Submitting plainly gives clean JSON with the id up
            # front, which stays useful even if this job later times out.
            AUTH=(--key /tmp/AuthKey.p8 --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID")
            id=$(xcrun notarytool submit "/tmp/$name.zip" "${AUTH[@]}" --output-format json \
                 | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
            echo "submitted $name -> $id"

            status="In Progress"
            for _ in $(seq 1 80); do    # 80 x 45s = 60 minutes
              sleep 45
              status=$(xcrun notarytool info "$id" "${AUTH[@]}" --output-format json \
                       | python3 -c "import json,sys; print(json.load(sys.stdin).get('status',''))")
              echo "  $id: $status"
              [ "$status" = "In Progress" ] || break
            done

            # Distinguish "Apple refused our binary" from "Apple never got round
            # to it". A rejection is our bug and must fail loudly. A submission
            # still In Progress after an hour is Apple's queue, and failing the
            # job for it would paint a perfectly good release red — this job runs
            # after the release is already published.
            case "$status" in
              Accepted)
                echo "$name notarized ($id)" ;;
              "In Progress")
                echo "::warning::$name is still In Progress after 60 minutes — Apple has not \
                  processed it. The release is unaffected; the binary is signed but not yet \
                  notarized. Submission id: $id"
                stalled=1 ;;
              *)
                echo "::error::$name was REJECTED (status: $status). Submission id: $id"
                echo "::group::notarytool log for $id"
                xcrun notarytool log "$id" "${AUTH[@]}" || true
                echo "::endgroup::"
                exit 1 ;;
            esac
            echo "::endgroup::"
          done
          if [ "$stalled" = "1" ]; then
            echo "::warning::One or more submissions never left Apple's queue. Re-run this \
              workflow with the submission id to check later — a notarization ticket applies \
              retroactively, so nothing needs re-releasing when it clears."
          fi

      - name: Clean up the private key
        if: always()
        run: rm -f /tmp/AuthKey.p8
